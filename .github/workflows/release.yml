name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build artifacts and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Ensure zip is present
        run: sudo apt-get install -y zip

      - name: Cross-compile binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/go-reverse-flow-linux-amd64 ./cmd/proxy
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/go-reverse-flow-linux-arm64 ./cmd/proxy
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/go-reverse-flow-darwin-amd64 ./cmd/proxy
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/go-reverse-flow-darwin-arm64 ./cmd/proxy
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/go-reverse-flow-windows-amd64.exe ./cmd/proxy

          cd dist
          for f in go-reverse-flow-*; do
            case "$f" in
              *windows*) zip -q "${f%.exe}.zip" "$f" ;;
              *)         tar czf "$f.tar.gz" "$f" ;;
            esac
            rm "$f"
          done
          ls -l

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
