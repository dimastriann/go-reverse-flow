name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build artifacts and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            echo "building $3..."
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
              -o "dist/go-reverse-flow-$3" ./cmd/proxy
          }

          GOOS=linux   GOARCH=amd64 build linux-amd64
          GOOS=linux   GOARCH=arm64 build linux-arm64
          GOOS=darwin  GOARCH=amd64 build darwin-amd64
          GOOS=darwin  GOARCH=arm64 build darwin-arm64
          GOOS=windows GOARCH=amd64 build windows-amd64.exe

          cd dist
          for f in go-reverse-flow-*; do
            case "$f" in
              *windows*) zip -q "${f%.exe}.zip" "$f" ;;
              *)         tar czf "$f.tar.gz" "$f" ;;
            esac
            rm "$f"
          done
          ls -l

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
